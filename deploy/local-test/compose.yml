# LOKALNY test odbiorczy (Docker Desktop) w ukladzie zblizonym do serwera: PostgreSQL 18.6 z baza "arbomachine"
# zalozona skryptem infrastruktury, baza "innej aplikacji" (arnocrm), Mailpit zamiast Gmaila, obraz ArboMachine.
# Wartosci ponizej sa TESTOWE (nie sa sekretami). Uruchomienie:
#   ARBOMACHINE_IMAGE_TAG=<tag> docker compose -f deploy/local-test/compose.yml up -d
#   aplikacja: http://localhost:18083   poczta: http://localhost:18025
#   sprzatanie (kasuje TYLKO dane tego testu): docker compose -f deploy/local-test/compose.yml down -v
name: arbomachine-local-test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: local-test-postgres-admin
      ARBOMACHINE_DB_PASSWORD: local-test-arbomachine
    volumes:
      - ../postgres/initdb/10-arbomachine.sh:/docker-entrypoint-initdb.d/10-arbomachine.sh:ro
      - ../../src/test/resources/postgres-test/20-other-application-database.sql:/docker-entrypoint-initdb.d/20-other-application-database.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arbomachine"]
      interval: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:18025:8025"

  arbomachine:
    image: arbomachine:${ARBOMACHINE_IMAGE_TAG:?ustaw ARBOMACHINE_IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: arbomachine
      DB_SCHEMA: arbomachine
      DB_USERNAME: arbomachine
      DB_PASSWORD: local-test-arbomachine
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: mailapptest75@gmail.com
      SMTP_APP_PASSWORD: not-used-by-mailpit
      SMTP_STARTTLS_REQUIRED: "false"
      JWT_SECRET: local-test-only-jwt-secret-0123456789abcdefghij
      APP_PUBLIC_BASE_URL: http://localhost:18083
      APP_REGISTRATION_EMAIL_CONFIRMATION_REQUIRED: "true"
    ports:
      - "127.0.0.1:18083:8083"
    volumes:
      - tree-photos:/app/storage/tree-photos
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  tree-photos:
