# Etap 38: Flyway jest w testach na classpath, ale testy domyslnie buduja schemat przez Hibernate.
# Migracje sprawdza osobno FlywayMigrationsIntegrationTest (spring.flyway.enabled=true).
spring.flyway.enabled=false

# Spring Boot 4: Flyway jest w runtime i wlaczony w application.properties - testy na H2 buduja schemat przez Hibernate.
# Migracje sprawdzaja osobno FlywayMigrationsIntegrationTest (H2) i PostgreSqlDeploymentIntegrationTest (PostgreSQL 18.6).
spring.jpa.hibernate.ddl-auto=create-drop
auth.jwt.secret=test-secret-key-for-arbomachine-unit-tests-0123456789
# Testy na H2: Hibernate zaklada tez schemat "arbomachine" (w aplikacji robi to Flyway).
spring.jpa.properties.jakarta.persistence.create-database-schemas=true
