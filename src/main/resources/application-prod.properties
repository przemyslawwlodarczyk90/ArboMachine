# Profil "prod" (SPRING_PROFILES_ACTIVE=prod) - wspolny serwer AWS za reverse proxy Caddy (HTTPS).
# Wszystkie dane dostepowe (DB_*, SMTP_*, JWT_SECRET, APP_PUBLIC_BASE_URL) przychodza ze zmiennych srodowiskowych.

# Czysta, dedykowana baza - brak baseline (wlaczenie tylko swiadomie, zmienna FLYWAY_BASELINE_ON_MIGRATE).
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.clean-disabled=true

# Za proxy: adres klienta, schemat https i host z naglowkow X-Forwarded-* (Caddy je ustawia).
server.forward-headers-strategy=framework

# Swagger / OpenAPI wylaczone na produkcji.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Szablony (maile, PDF) kompilowane raz.
spring.thymeleaf.cache=true

# Rejestracja wymaga potwierdzenia e-mail (SMTP skonfigurowany).
app.registration.email-confirmation-required=${APP_REGISTRATION_EMAIL_CONFIRMATION_REQUIRED:true}
