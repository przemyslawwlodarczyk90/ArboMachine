<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Your Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .email-container {
            background-color: #ffffff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        .email-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #dddddd;
        }
        .email-body {
            padding: 20px 0;
        }
        .email-footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #dddddd;
            color: #777777;
            font-size: 12px;
        }
        .btn-confirm {
            display: inline-block;
            padding: 10px 20px;
            margin: 20px 0;
            background-color: #28a745;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn-confirm:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>ArboMachine - password reset</h1>
    </div>
    <div class="email-body">
        <p>Hi <span th:text="${firstName}"></span>,</p>
        <p>We received a request to reset the password for your account. Click the button below to set a new one. The link is valid for <span th:text="${resetLinkValidityMinutes}"></span> minutes.</p>
        <a th:href="${resetLink}" class="btn-confirm">Reset Password</a>
    </div>
    <div class="email-footer">
        <p>If you did not request a password reset, you can safely ignore this email - your password will not change.</p>
    </div>
</div>
</body>
</html>
