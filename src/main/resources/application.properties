spring.application.name=ArboMachine
# Port backendu. Na tym komputerze 8080 zajmuje AgentService.exe - wtedy uruchamiaj z ARBOMACHINE_PORT=8081.
server.port=${ARBOMACHINE_PORT:8080}

# Wrazliwe dane (login/haslo SMTP, sekret JWT) NIE leza tutaj - patrz arbomachine-secrets.properties
# (w .gitignore) i wzor arbomachine-secrets.properties.example.
spring.config.import=optional:classpath:arbomachine-secrets.properties

# --- Baza danych (PostgreSQL; docker compose up -d z compose.yaml w korzeniu repo) ---
spring.datasource.url=${ARBOMACHINE_DB_URL:jdbc:postgresql://localhost:5432/pgDB}
spring.datasource.username=${ARBOMACHINE_DB_USER:user}
spring.datasource.password=${ARBOMACHINE_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Kontener stawiamy recznie (albo juz dziala na 5432) - bez tego spring-boot-docker-compose
# sam odpalilby compose.yaml przy starcie i nadpisal datasource.
spring.docker.compose.enabled=false

# --- Hibernate: tryb update - schemat (konta, tokeny) przetrwa restart ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Baza pgDB jest wspoldzielona z innymi projektami - ArboMachine trzyma swoje tabele
# we wlasnym schemacie "arbomachine", ktory Hibernate zaklada przy starcie.
spring.jpa.properties.hibernate.default_schema=arbomachine
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# --- SMTP (login/haslo w pliku secrets) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Actuator domyslnie wlaczylby "mail" w /actuator/health i przy braku SMTP ustawil caly status na DOWN.
management.health.mail.enabled=false
# Nazwa nadawcy widoczna w skrzynce odbiorcy ("ArboMachine <adres@gmail.com>").
app.mail.sender-display-name=ArboMachine

# --- Logowanie / JWT (auth.jwt.secret w pliku secrets) ---
auth.jwt.token-validity-days=7
auth.jwt.issuer=ArboMachine

# --- Linki w mailach ---
# Adres frontendu (React) - z niego skladane sa linki potwierdzenia konta i resetu hasla.
app.frontend-base-url=${ARBOMACHINE_FRONTEND_BASE_URL:http://localhost:5173}
# Domyslnie WYMAGANE - rejestracja wysyla mail z linkiem, konto jest nieaktywne do czasu klikniecia.
# Nadpisz na "false" w LOKALNYM arbomachine-secrets.properties (nie tutaj!), jesli SMTP nie dziala -
# konta beda aktywowane od razu, bez maila.
app.registration.email-confirmation-required=true
# Jak dlugo dziala link do resetu hasla.
app.password-reset.link-validity-minutes=30

# --- Thymeleaf (szablony maili) ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# --- Swagger / OpenAPI: http://localhost:8080/swagger-ui.html ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.arbomachine.infrastructure.api

# --- Zdjecia drzew (TreePhoto) ---
# Storage V1: pliki na dysku, metadane w bazie. Sciezka wzgledna liczona od katalogu roboczego aplikacji.
app.tree-photos.storage-directory=${ARBOMACHINE_TREE_PHOTOS_DIRECTORY:storage/tree-photos}
# Limit jednego zdjecia (domyslnie 15MB, TreePhotoProperties); z niego liczony jest tez limit multipart serwera.
app.tree-photos.max-file-size=${ARBOMACHINE_TREE_PHOTO_MAX_FILE_SIZE:15MB}
# Tomcat doczytuje do tylu bajtow odrzuconego (za duzego) zadania - klient dostaje czytelne 413,
# a nie zerwane polaczenie.
server.tomcat.max-swallow-size=100MB
