spring.application.name=ArboMachine
# Port backendu. Na tym komputerze 8080 zajmuje AgentService.exe - wtedy uruchamiaj z ARBOMACHINE_PORT=8081.
server.port=${ARBOMACHINE_PORT:8083}

# ============================================================
# ADRESY (przy domyslnym porcie 8083; inny port -> zmien liczbe w adresach)
# ============================================================
# Aplikacja (frontend zbudowany przez "npm run build" w frontend/, serwowany przez Spring):
#   http://localhost:8083/
#   logowanie:           http://localhost:8083/login
#   projekty arborysty:  http://localhost:8083/projects
# Bez zbudowanego frontendu http://localhost:8083/ przekierowuje do Swaggera.
#
# Swagger UI (dokumentacja i testowanie API):  http://localhost:8083/swagger-ui.html
# OpenAPI JSON:                                 http://localhost:8083/v3/api-docs
# REST API:                                     http://localhost:8083/api/...
#   np. http://localhost:8083/api/projects (wymaga tokenu JWT)
#
# Frontend w trybie developerskim (hot reload, "npm run dev" w frontend/):
#   http://localhost:5173/   - /api przekierowywane na backend; przy porcie 8083 uruchamiaj:
#   API_PROXY_TARGET=http://localhost:8083 npm run dev
#
# PostgreSQL (kontener Docker offerbrowserprototype-postgres-1): localhost:5432, baza pgDB, schemat arbomachine
# ============================================================

# Wrazliwe dane (login/haslo SMTP, sekret JWT) NIE leza tutaj - patrz arbomachine-secrets.properties
# (w .gitignore) i wzor arbomachine-secrets.properties.example.
spring.config.import=optional:classpath:arbomachine-secrets.properties

# --- Baza danych (PostgreSQL) ---
# Produkcja: WYLACZNIE zmienne srodowiskowe DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD (deploy/.env.example).
# Wartosci domyslne ponizej = lokalny PostgreSQL deweloperski (baza pgDB, schemat arbomachine).
# Pelny adres mozna nadpisac zmienna SPRING_DATASOURCE_URL (ma pierwszenstwo przed ta linia).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pgDB}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Maly serwer (t3.small, dwie aplikacje): 4 polaczenia, 1 bezczynne. Regulacja: DB_POOL_MAX_SIZE, DB_POOL_MIN_IDLE.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=300000
# Kontener stawiamy recznie (albo juz dziala na 5432) - bez tego spring-boot-docker-compose
# sam odpalilby compose.yaml przy starcie i nadpisal datasource.
spring.docker.compose.enabled=false

# --- Schemat: tworzy i aktualizuje WYLACZNIE Flyway (db/migration), Hibernate tylko sprawdza zgodnosc ---
# Schemat "arbomachine" jest wpisany w migracje V1-V10 (create table arbomachine.xxx), dlatego DB_SCHEMA
# musi pozostac "arbomachine" - zmienna istnieje dla czytelnosci konfiguracji, nie do zmiany nazwy.
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:arbomachine}
spring.flyway.default-schema=${DB_SCHEMA:arbomachine}
spring.flyway.create-schemas=true
# Lokalna baza deweloperska zbudowana kiedys przez ddl-auto=update nie ma historii Flyway - przy pierwszym starcie
# zostaje oznaczona jako V1 (bez wykonywania), a V2-V10 (idempotentne, "if not exists") uzupelniaja braki.
# Produkcja (czysta baza) ustawia FLYWAY_BASELINE_ON_MIGRATE=false - patrz docs/MIGRACJE_BAZY.md.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:arbomachine}
# Zapytania tylko w transakcjach serwisow - polaczenie nie jest trzymane przez caly request (np. generowanie PDF).
spring.jpa.open-in-view=false

# --- SMTP: zmienne SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_APP_PASSWORD (haslo aplikacji Gmail - tylko w .env) ---
# Lokalnie login/haslo moga lezec w arbomachine-secrets.properties (poza Gitem) - ten plik ma pierwszenstwo.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false
# Actuator: publicznie tylko /actuator/health (healthcheck Dockera); szczegoly tylko w logach.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Nazwa nadawcy widoczna w skrzynce odbiorcy ("ArboMachine <adres@gmail.com>").
app.mail.sender-display-name=ArboMachine

# --- Logowanie / JWT: sekret ze zmiennej JWT_SECRET (min. 32 losowe znaki); lokalnie moze lezec w pliku secrets ---
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.token-validity-days=7
auth.jwt.issuer=ArboMachine

# --- Linki w mailach ---
# Adres frontendu (React) - z niego skladane sa linki potwierdzenia konta i resetu hasla.
# Frontend jest serwowany przez backend, wiec domyslnie ten sam port co server.port (np. http://localhost:8083).
# Przy pracy na "npm run dev" ustaw ARBOMACHINE_FRONTEND_BASE_URL=http://localhost:5173.
app.frontend-base-url=${APP_PUBLIC_BASE_URL:${ARBOMACHINE_FRONTEND_BASE_URL:http://localhost:${server.port}}}
# Domyslnie WYMAGANE - rejestracja wysyla mail z linkiem, konto jest nieaktywne do czasu klikniecia.
# Nadpisz na "false" w LOKALNYM arbomachine-secrets.properties (nie tutaj!), jesli SMTP nie dziala -
# konta beda aktywowane od razu, bez maila.
app.registration.email-confirmation-required=true
# Rejestracja kont urzednika - chwilowo zamknieta (formularz pokazuje tylko arboryste, API odrzuca OFFICIAL 403).
# Istniejace konta urzednikow dzialaja dalej; admin nadal moze zmienic role konta.
app.registration.official-enabled=${REGISTRATION_OFFICIAL_ENABLED:false}
# Tryb demo: wejscie ze strony logowania bez konta, przykladowe projekty arborysty tylko do odczytu.
# true = przy starcie zakladane jest konto demo i (raz) dane pokazowe; zapis z konta demo zawsze konczy sie 403.
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.account-email=${DEMO_ACCOUNT_EMAIL:demo@arbomachine.invalid}
app.demo.session-hours=${DEMO_SESSION_HOURS:4}
# Jak dlugo dziala link do resetu hasla.
app.password-reset.link-validity-minutes=30

# --- Thymeleaf (szablony maili) ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# --- JSON (Spring Boot 4 = Jackson 3): domyslne zachowanie jak w Jackson 2, zeby API sie nie zmienilo ---
spring.jackson.use-jackson2-defaults=true

# --- Swagger / OpenAPI: http://localhost:8083/swagger-ui.html ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.arbomachine.infrastructure.api

# --- Zdjecia drzew (TreePhoto) ---
# Storage V1: pliki na dysku, metadane w bazie. Sciezka wzgledna liczona od katalogu roboczego aplikacji.
app.tree-photos.storage-directory=${ARBOMACHINE_TREE_PHOTOS_DIRECTORY:storage/tree-photos}
# Limit jednego zdjecia (domyslnie 15MB, TreePhotoProperties); z niego liczony jest tez limit multipart serwera.
app.tree-photos.max-file-size=${ARBOMACHINE_TREE_PHOTO_MAX_FILE_SIZE:15MB}
# Tomcat doczytuje do tylu bajtow odrzuconego (za duzego) zadania - klient dostaje czytelne 413,
# a nie zerwane polaczenie.
server.tomcat.max-swallow-size=100MB

# --- Dokument projektu PDF: jedno generowanie naraz (duze zdjecia = setki MB sterty; dwa naraz konczyly sie OOM) ---
# Kolejne zadanie czeka do max-wait-seconds, potem 503 z prosba o ponowienie.
app.project-documents.max-concurrent-generations=${PDF_MAX_CONCURRENT_GENERATIONS:1}
app.project-documents.max-wait-seconds=${PDF_MAX_WAIT_SECONDS:120}
